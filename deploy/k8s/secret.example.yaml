# Plantilla del Secret de runtime. NO commitear el real: crear con
#   kubectl create secret generic servicecontrol-env --from-env-file=.env.production
# o con un operador de secretos (External Secrets, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: servicecontrol-env
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: your-anon-key
  SUPABASE_SERVICE_ROLE_KEY: your-service-role-key
  RESEND_API_KEY: re_xxxxxxxxxxxx
  RESEND_FROM_EMAIL: noreply@yourdomain.com
  CRON_SECRET: your-cron-secret
  SUPERADMIN_SECRET: your-superadmin-secret
  TRAINING_REGISTRATION_SECRET: your-training-secret
  LOGTAIL_SOURCE_TOKEN: your-logtail-source-token
  STRIPE_SECRET_KEY: sk_live_xxxxxxxxxxxx
  STRIPE_WEBHOOK_SECRET: whsec_xxxxxxxxxxxx
  NEXT_PUBLIC_APP_URL: https://app.servicecontrol.example
  UPSTASH_REDIS_REST_URL: https://your-upstash.upstash.io
  UPSTASH_REDIS_REST_TOKEN: your-upstash-token
