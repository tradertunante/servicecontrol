<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0C1F44"/>
      <stop offset="100%" stop-color="#1a3a7a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Fondo degradado -->
  <rect width="1128" height="191" fill="url(#bg)"/>

  <!-- Capa de brillo derecha -->
  <rect width="1128" height="191" fill="url(#glow)"/>

  <!-- Línea de acento inferior -->
  <rect x="0" y="186" width="1128" height="5" fill="#2563EB" opacity="0.6"/>

  <!-- Tagline centrada -->
  <text x="564" y="78" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="32" font-weight="700" fill="#FFFFFF">
    Audita. Asigna. Verifica.
  </text>

  <text x="564" y="114" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" fill="rgba(255,255,255,0.65)">
    La calidad de tu hotel, convertida en sistema.
  </text>

  <!-- CTA pill -->
  <rect x="444" y="133" width="240" height="34" rx="17" fill="#2563EB"/>
  <text x="564" y="155" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="0.3">
    Prueba gratis — servicecontrol.app/trial
  </text>
</svg>
