name: Integration tests (Supabase)

# Corren contra el proyecto Supabase real (crean y limpian sus propios datos).
# Nightly para detectar drift de RLS/policies, y bajo demanda antes de cambios
# sensibles. Requiere secrets: NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC diario
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    # No fallar en forks / repos sin secrets configurados
    if: ${{ github.repository == 'tradertunante/servicecontrol' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:integration
